name: Reusable / Format

on:
  workflow_call:

jobs:
  format:
    name: dotnet format

    permissions:
      contents: read
      packages: read # restore pulls OpenFeature.* from GitHub Packages

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore
        run: dotnet restore

      # Analyzers that back the format rules need the compilation, so the build is not
      # optional here.
      - name: Build
        run: dotnet build --no-restore

      - name: dotnet format
        run: dotnet format --verify-no-changes --no-restore DotnetSdkContrib.slnx
