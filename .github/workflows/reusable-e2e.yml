name: Reusable / E2E Tests

on:
  workflow_call:

jobs:
  e2e:
    name: dotnet test

    permissions:
      contents: read
      packages: read # restore pulls OpenFeature.* from GitHub Packages

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `submodules: recursive` is required: the flagd E2E suite runs the flagd-testbed
      # submodule through Testcontainers.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Build
        run: dotnet build

      # Scoped to the two E2E projects on purpose. Running `dotnet test` across the whole
      # solution here re-ran every unit test that the Build job already covers, and buried
      # the E2E results among 20+ other test assemblies.
      #
      # `summary.includePassedTests` defaults to false, so with no failures the logger
      # rendered an empty summary and the E2E scenarios were invisible in the run UI.
      - name: E2E (in-process resolver)
        env:
          E2E: "true"
        run: >
          dotnet test test/OpenFeature.Providers.Flagd.E2e.ProcessTest/OpenFeature.Providers.Flagd.E2e.ProcessTest.csproj
          --no-build
          --logger "GitHubActions;summary.includePassedTests=true"

      - name: E2E (rpc resolver)
        # Report both resolvers even when the first one fails.
        if: ${{ !cancelled() }}
        env:
          E2E: "true"
        run: >
          dotnet test test/OpenFeature.Providers.Flagd.E2e.RpcTest/OpenFeature.Providers.Flagd.E2e.RpcTest.csproj
          --no-build
          --logger "GitHubActions;summary.includePassedTests=true"
