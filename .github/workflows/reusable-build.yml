name: Reusable / Build & Test

# Callable building block for ci.yml. `workflow_call` is the only trigger on purpose: a
# reusable workflow that also triggered on its own would run twice for every event.

on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.os }}

    permissions:
      contents: read
      packages: read # restore pulls OpenFeature.* from GitHub Packages

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --logger GitHubActions
