name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  # Supersede in-flight runs for the same pull request, but never cancel a merge queue run:
  # a cancelled run reports a non-success conclusion and ejects the pull request from the
  # queue. Deliberately not set in the called workflows - sharing a group between caller and
  # callee makes a run cancel itself.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# A called workflow's permissions can be maintained or reduced but never elevated, so
# `packages:` has to be declared on both the caller job and the callee job or `dotnet
# restore` loses access to the GitHub Packages feed.
jobs:
  build:
    name: Build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-build.yml

  format:
    name: Format
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-format.yml

  e2e:
    name: E2E
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-e2e.yml

  packaging:
    name: Packaging
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-packaging.yml

  ci-gate:
    name: CI Gate
    if: always()
    needs: [build, format, e2e, packaging]

    permissions:
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check that every gated job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # Comma-separated jobs allowed to report `skipped`. Empty on purpose: nothing here
          # is skipped by design, so an accidental `if:` cannot quietly stop gating a job.
          ALLOWED_SKIPS: ""
        run: |
          {
            echo "### CI Gate"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS_JSON" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          failing=$(echo "$NEEDS_JSON" | jq -r --arg allowed "$ALLOWED_SKIPS" '
            ($allowed | split(",") | map(select(length > 0))) as $ok
            | to_entries[]
            | select(.value.result != "success")
            | select(.value.result != "skipped" or ([.key] - $ok | length) > 0)
            | "\(.key): \(.value.result)"
          ')

          if [ -n "$failing" ]; then
            echo "::error::One or more gated jobs did not succeed:"
            echo "$failing"
            exit 1
          fi

          echo "All gated jobs succeeded or were intentionally skipped."
